<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 200" width="250" height="200">
  <defs>
    <linearGradient id="symGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009e3e"/>
      <stop offset="100%" stop-color="#006324"/>
    </linearGradient>
    <linearGradient id="symYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
    <linearGradient id="symBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005bac"/>
      <stop offset="100%" stop-color="#002b66"/>
    </linearGradient>
  </defs>

  <g transform="translate(5, 5)">
    <!-- Top yellow arc trim -->
    <path d="M 68 108 C 88 108, 120 95, 175 88 C 218 82, 235 90, 245 92 C 205 105, 170 125, 150 148 C 110 128, 85 116, 68 108 Z" fill="url(#symYellow)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Main Green Body -->
    <path d="M 12 172 C 30 152, 55 130, 68 108 C 65 125, 80 138, 98 140 C 65 146, 38 160, 12 172 Z" fill="url(#symGreen)" stroke="url(#symYellow)" stroke-width="1.5"/>
    <path d="M 12 172 C 45 160, 95 140, 150 148 C 175 152, 195 158, 210 160 C 160 165, 105 178, 12 172 Z" fill="url(#symGreen)"/>
    <path d="M 68 108 C 95 110, 140 100, 195 90 C 165 115, 145 138, 135 152 C 105 148, 80 135, 68 108 Z" fill="url(#symGreen)"/>
    
    <!-- Outer Yellow Outline Border contour -->
    <path d="M 12 172 C 32 148, 62 118, 68 108 C 98 105, 160 88, 248 92 C 205 105, 168 130, 148 152 C 180 155, 202 158, 212 160 C 145 168, 80 178, 12 172 Z" fill="none" stroke="url(#symYellow)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Bottom Yellow Accent Curve -->
    <path d="M 98 140 C 135 150, 175 154, 212 160 C 158 166, 110 174, 18 174" fill="none" stroke="url(#symYellow)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Blue Celestial Globe -->
    <g transform="translate(162, 106)">
      <path d="M 2 30 C 0 10, 18 -6, 42 -6 C 58 -6, 68 2, 70 8 C 58 24, 48 38, 42 50 C 22 48, 6 42, 2 30 Z" fill="url(#symBlue)" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 0 32 C 14 18, 30 6, 52 0 C 50 6, 46 14, 42 22 C 26 26, 12 30, 0 32 Z" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>
</svg>
